# SwiftLint config. Lenient first pass: existing code produces warnings only,
# so CI fails solely on new error-level violations. Tighten rules over time.
included:
  - ntfy
  - ntfyNSE
  - ntfyTests

disabled_rules:
  - trailing_whitespace   # pervasive in existing code; fixing it would touch most files
  - todo

# Existing violations, downgraded from error to warning.
force_cast: warning
shorthand_operator: warning
attribute_name_spacing: warning
identifier_name:
  severity: warning
  min_length: 2
  validates_start_with_lowercase: warning
  excluded: [id, o]

line_length:
  warning: 160
  error: 500
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 600
  error: 1200
type_body_length:
  warning: 450
  error: 900
function_body_length:
  warning: 80
  error: 200
